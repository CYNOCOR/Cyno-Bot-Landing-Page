<!-- ===================================================================== -->
<!-- APPLE-INSPIRED REFINED FLOATING NAVIGATION BAR                        -->
<!-- ===================================================================== -->
<header id="main-nav-wrapper" class="sticky top-0 z-50 w-full transition-all duration-300 bg-[#000000]">
    <div id="main-nav-pill" class="w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 sm:py-3.5 flex items-center justify-between gap-2 sm:gap-4 transition-all duration-300 relative">
        
        <!-- Apple Specular Top Hairline Reflection (Fades in when floating dock mode is active) -->
        <div class="nav-specular absolute inset-x-8 top-0 h-[1px] bg-gradient-to-r from-transparent via-white/15 to-transparent pointer-events-none rounded-full opacity-0 transition-opacity duration-300"></div>

        <!-- ============================================================= -->
        <!-- LEFT: CYNOCOR BRAND IDENTITY & LOGO                           -->
        <!-- ============================================================= -->
        <a href="#cynobot" onclick="scrollToOverview(event)" class="flex items-center gap-2.5 group shrink-0 pl-1 select-none cursor-pointer" title="CYNO BOT &bull; Home">
            <!-- Brand Icon -->
            <div class="w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-white/[0.05] border border-white/[0.12] flex items-center justify-center p-1 group-hover:border-[#29d8ff]/60 group-hover:bg-white/[0.1] transition-all duration-300 shadow-xs relative overflow-hidden">
                <img src="assets/images/cynocor-logo.png" alt="CYNOCOR Logo" class="w-full h-full object-contain drop-shadow-[0_0_8px_rgba(41,216,255,0.45)] group-hover:scale-110 transition-transform duration-300" />
            </div>
            <!-- Wordmark + Version Badge -->
            <div class="flex items-center gap-1.5">
                <span class="font-semibold tracking-tight text-sm sm:text-[15px] text-white group-hover:text-[#29d8ff] transition-colors duration-200">CYNOCOR</span>
                <span class="text-[9px] font-mono px-1.5 py-0.5 rounded-full bg-white/[0.06] text-[#86868b] border border-white/[0.08] font-medium hidden sm:inline">v1.0</span>
            </div>
        </a>

        <!-- ============================================================= -->
        <!-- CENTER: APPLE-INSPIRED REFINED DESKTOP NAVIGATION LINKS       -->
        <!-- ============================================================= -->
        <nav class="hidden lg:flex items-center gap-0.5 xl:gap-1 text-[12px] font-normal tracking-[-0.01em] text-[#86868b]">
            <a href="#cynobot" data-nav-id="cynobot" onclick="scrollToOverview(event)" class="nav-spy-link px-2.5 xl:px-3 py-1 rounded-full text-white font-medium bg-white/[0.1] border border-white/[0.1] transition-all duration-200 flex items-center gap-1.5 shadow-xs cursor-pointer">
                <span class="nav-dot w-1.5 h-1.5 rounded-full bg-[#29d8ff] shrink-0"></span>
                <span>Overview</span>
            </a>
            <a href="#hero-studio" data-nav-id="hero-studio" class="nav-spy-link px-2.5 xl:px-3 py-1 rounded-full hover:text-white hover:bg-white/[0.06] transition-all duration-200 flex items-center gap-1.5">
                <span>3D Studio</span>
            </a>
            <a href="#kiosk-simulator" data-nav-id="kiosk-simulator" class="nav-spy-link px-2.5 xl:px-3 py-1 rounded-full hover:text-white hover:bg-white/[0.06] transition-all duration-200 flex items-center gap-1.5">
                <span>Kiosk</span>
            </a>
            <a href="#greeting-flow" data-nav-id="greeting-flow" class="nav-spy-link px-2.5 xl:px-3 py-1 rounded-full hover:text-white hover:bg-white/[0.06] transition-all duration-200 flex items-center gap-1.5">
                <span>Flow</span>
            </a>
            <a href="#architecture" data-nav-id="architecture" class="nav-spy-link px-2.5 xl:px-3 py-1 rounded-full hover:text-white hover:bg-white/[0.06] transition-all duration-200 flex items-center gap-1.5">
                <span>Architecture</span>
            </a>
            <a href="#fabrication" data-nav-id="fabrication" class="nav-spy-link px-2.5 xl:px-3 py-1 rounded-full hover:text-white hover:bg-white/[0.06] transition-all duration-200 flex items-center gap-1.5">
                <span>Fabrication</span>
            </a>
            <a href="#plan-budget" data-nav-id="plan-budget" class="nav-spy-link px-2.5 xl:px-3 py-1 rounded-full hover:text-white hover:bg-white/[0.06] transition-all duration-200 flex items-center gap-1.5">
                <span>Budget</span>
            </a>
            <a href="#team" data-nav-id="team" class="nav-spy-link px-2.5 xl:px-3 py-1 rounded-full hover:text-white hover:bg-white/[0.06] transition-all duration-200 flex items-center gap-1.5">
                <span>Team</span>
            </a>
        </nav>

        <!-- ============================================================= -->
        <!-- RIGHT: VOICE SYNTHESIS TOGGLE                                 -->
        <!-- ============================================================= -->
        <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">
            <!-- Voice Mute Control Pill -->
            <button id="voice-mute-btn" onclick="toggleVoiceMute()" class="px-2.5 py-1 rounded-full bg-white/[0.06] hover:bg-white/[0.1] border border-white/[0.1] text-[11px] font-mono text-slate-200 flex items-center gap-1.5 transition-all duration-200 active:scale-[0.97] cursor-pointer" title="Toggle Robot Voice Feedback">
                <i id="voice-icon" class="fa-solid fa-volume-high text-[#29d8ff] text-xs"></i>
                <span id="voice-label" class="hidden sm:inline font-medium text-slate-200">Voice: ON</span>
            </button>

            <!-- Mobile Menu Toggle Button (Visible on < lg) -->
            <button onclick="document.getElementById('mobile-nav-drawer').classList.toggle('hidden')" class="lg:hidden w-7 h-7 sm:w-8 sm:h-8 rounded-full bg-white/[0.06] border border-white/[0.1] text-slate-300 hover:text-white flex items-center justify-center transition active:scale-95 cursor-pointer" aria-label="Toggle navigation menu">
                <i class="fa-solid fa-bars text-xs"></i>
            </button>
        </div>

    </div>

    <!-- ============================================================= -->
    <!-- MOBILE NAVIGATION POPOVER DRAWER (VisionOS Frosted Sheet)     -->
    <!-- ============================================================= -->
    <div id="mobile-nav-drawer" class="hidden lg:hidden max-w-5xl mx-3 sm:mx-auto mt-2 rounded-3xl border border-white/[0.12] bg-[#0a0c14]/95 backdrop-blur-2xl p-3 space-y-1 shadow-[0_16px_48px_rgba(0,0,0,0.85)] pointer-events-auto">
        <a href="#cynobot" onclick="scrollToOverview(event); document.getElementById('mobile-nav-drawer').classList.add('hidden')" class="flex items-center gap-3 px-3 py-2 rounded-2xl text-xs font-medium text-white bg-white/[0.08] border border-white/[0.1] transition">
            <i class="fa-solid fa-robot text-xs text-[#29d8ff] w-4"></i> Overview
        </a>
        <a href="#hero-studio" onclick="document.getElementById('mobile-nav-drawer').classList.add('hidden')" class="flex items-center gap-3 px-3 py-2 rounded-2xl text-xs font-normal text-[#86868b] hover:text-white hover:bg-white/[0.06] transition">
            <i class="fa-solid fa-cube text-xs w-4"></i> 3D Studio Inspector
        </a>
        <a href="#kiosk-simulator" onclick="document.getElementById('mobile-nav-drawer').classList.add('hidden')" class="flex items-center gap-3 px-3 py-2 rounded-2xl text-xs font-normal text-[#86868b] hover:text-white hover:bg-white/[0.06] transition">
            <i class="fa-solid fa-tablet-screen-button text-xs w-4"></i> 10" Chest Kiosk Simulator
        </a>
        <a href="#greeting-flow" onclick="document.getElementById('mobile-nav-drawer').classList.add('hidden')" class="flex items-center gap-3 px-3 py-2 rounded-2xl text-xs font-normal text-[#86868b] hover:text-white hover:bg-white/[0.06] transition">
            <i class="fa-solid fa-wave-square text-xs w-4"></i> 6-Step Interaction Flow
        </a>
        <a href="#architecture" onclick="document.getElementById('mobile-nav-drawer').classList.add('hidden')" class="flex items-center gap-3 px-3 py-2 rounded-2xl text-xs font-normal text-[#86868b] hover:text-white hover:bg-white/[0.06] transition">
            <i class="fa-solid fa-microchip text-xs w-4"></i> System Architecture (M1 Core)
        </a>
        <a href="#fabrication" onclick="document.getElementById('mobile-nav-drawer').classList.add('hidden')" class="flex items-center gap-3 px-3 py-2 rounded-2xl text-xs font-normal text-[#86868b] hover:text-white hover:bg-white/[0.06] transition">
            <i class="fa-solid fa-screwdriver-wrench text-xs w-4"></i> Fabrication & Evolution Roadmap
        </a>
        <a href="#plan-budget" onclick="document.getElementById('mobile-nav-drawer').classList.add('hidden')" class="flex items-center gap-3 px-3 py-2 rounded-2xl text-xs font-normal text-[#86868b] hover:text-white hover:bg-white/[0.06] transition">
            <i class="fa-solid fa-chart-gantt text-xs w-4"></i> 9-Month Plan & LKR Budget
        </a>
        <a href="#team" onclick="document.getElementById('mobile-nav-drawer').classList.add('hidden')" class="flex items-center gap-3 px-3 py-2 rounded-2xl text-xs font-normal text-[#86868b] hover:text-white hover:bg-white/[0.06] transition">
            <img src="assets/images/cynocor-logo.png" alt="CYNOCOR" class="w-4 h-4 object-contain shrink-0" /> Team CYNOCOR (Group G 40)
        </a>

        <!-- Mobile Quick Actions -->
        <div class="pt-2 border-t border-white/[0.08] flex items-center justify-center gap-2 px-1">
            <button onclick="toggleVoiceMute()" class="w-full py-1.5 rounded-full bg-white/[0.06] text-[11px] font-mono text-slate-200 flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-volume-high text-[#29d8ff] text-xs"></i>
                <span>Toggle Voice</span>
            </button>
        </div>
    </div>
</header>
